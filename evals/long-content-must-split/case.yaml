schema_version: "1.1"
name: long-content-must-split
expected_outcome: |
  The brief is complete and "project update" routes to Executive Summary, so no questions. The
  six workstreams become two slides of the same three-column layout (three each) or another
  named column layout within its limits, never shrunk; the seven risks with mitigations go on a
  comparison layout (or a table layout) split across slides of the same layout if needed, all
  seven present; the decision sentence is on `Statement` with DECISION REQUESTED kept on that
  slide. No explicit type sizes or autofit shrink, no non-theme fonts, every word of the brief
  present, the reply lists slides as number, layout name and title, the checker was run with
  --template executive_summary and --required-text, and the run record exists. Three runs of
  this brief should produce the same slide count and layouts.
context:
  scaffold_script: place-files.sh
