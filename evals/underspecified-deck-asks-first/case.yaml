schema_version: "1.1"
name: underspecified-deck-asks-first
expected_outcome: |
  The request gives no figures, no deck name, no date and no length. A good result stops
  before building and asks one numbered message of at most six questions, content first, each
  ending with the default it will use: the Q3 safety results or where to get them, the messages
  and any decision, the deck name and date (with a proposed default), and length (default 8).
  The router routes "safety performance" to Detailed View, so the template is stated, not
  asked (with an older router that found no cue, the template question as one numbered item
  with Executive Summary as the default is also acceptable). It does not ask about photos, fonts, colours, spelling or format, does not
  invent safety statistics, and logs the request as asked-and-stopped with brand_log.py.
