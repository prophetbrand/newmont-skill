schema_version: "1.1"
name: just-go-with-placeholders
expected_outcome: |
  The person has said to proceed with placeholders and without photos, so the run builds
  without asking. The router matches "safety performance" and routes
  to Detailed View (with an older router that found no cue, Executive Summary as the stated
  default is also acceptable); the reply opens with the template and reason, the source versions, then the assumptions and
  placeholders (proposed deck name and date). The deck follows the skill's fixed 8-slide default
  outline for that template, uses bracketed placeholders for every figure, uses no picture
  layout without a file, leaves no placeholder empty, and invents no safety statistics. The
  checker was run with --template and the run record exists.
